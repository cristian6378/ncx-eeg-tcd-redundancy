[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "ncx-redundancy"
version = "1.1.0"
description = "Two origins of feature redundancy: a matched-taxonomy comparison of stroke-related qEEG and transcranial Doppler"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
keywords = ["feature redundancy", "quantitative EEG", "transcranial Doppler",
            "feature selection", "equivalence testing", "stroke"]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "pandas>=2.0",
    "scikit-learn>=1.3,<1.10",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
test = ["pytest>=7.4"]

[tool.setuptools]
packages = ["ncx"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    "ignore::FutureWarning",
    "ignore::UserWarning",
]
